name: Bug report
description: Something is not working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [FAQ / Troubleshooting](../../README.md#faq--troubleshooting) section.

  - type: input
    id: flutter_version
    attributes:
      label: Flutter version
      description: Output of `flutter --version`
      placeholder: Flutter 3.x.x • channel stable
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      multiple: true
      options:
        - Android 13+
        - Android 8–12
        - iOS
        - Web
        - Desktop (macOS / Linux / Windows)
    validations:
      required: true

  - type: input
    id: langswitch_version
    attributes:
      label: langswitch version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A minimal Flutter project or code snippet that reproduces the issue.
        Issues without reproductions will be closed after two weeks.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
