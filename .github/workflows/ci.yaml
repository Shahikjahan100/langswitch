name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Format, analyze, and test (Dart + Flutter) ──────────────────────────────
  dart:
    name: Format / Analyze / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: langswitch
        run: flutter pub get

      - name: Check formatting
        working-directory: langswitch
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: langswitch
        run: flutter analyze

      - name: Run tests with coverage
        working-directory: langswitch
        run: flutter test --coverage

  # ── CLI tests ────────────────────────────────────────────────────────────────
  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: langswitch
        run: flutter pub get

      - name: Run CLI tests
        working-directory: langswitch
        run: dart test test/cli_test.dart

  # ── Example app — Android debug build ───────────────────────────────────────
  example-android:
    name: Example — Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (plugin)
        working-directory: langswitch
        run: flutter pub get

      - name: Install dependencies (example)
        working-directory: langswitch/example
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: langswitch/example
        run: flutter build apk --debug

  # ── Example app — iOS no-codesign build ─────────────────────────────────────
  example-ios:
    name: Example — iOS no-codesign build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (plugin)
        working-directory: langswitch
        run: flutter pub get

      - name: Install dependencies (example)
        working-directory: langswitch/example
        run: flutter pub get

      - name: Build iOS (no code sign)
        working-directory: langswitch/example
        run: flutter build ios --no-codesign
