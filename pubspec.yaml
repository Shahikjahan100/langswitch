name: langswitch
description: "One-command per-app language switching for Flutter: Android 13+ and iOS system language settings, persistence, and a ready-made picker."
version: 0.1.0
repository: https://github.com/Shahikjahan100/langswitch

topics:
  - localization
  - internationalization
  - language
  - locale
  - i18n

environment:
  sdk: "^3.5.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  shared_preferences: ^2.5.6
  args: ^2.7.0
  path: ^1.9.1
  xml: ^7.1.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.langswitch
        pluginClass: LangswitchPlugin
      ios:
        pluginClass: LangswitchPlugin
      linux:
        dartPluginClass: LangswitchDartOnly
      macos:
        dartPluginClass: LangswitchDartOnly
      windows:
        dartPluginClass: LangswitchDartOnly
